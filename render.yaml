# Render Blueprint — Koodo PWA
# Déploie l'API Express + le client Vite (servi statiquement) en un seul Web Service.

services:
  - type: web
    name: koodo
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_MODE
        value: simulated
      - key: PAYMENTS_MODE
        value: sandbox